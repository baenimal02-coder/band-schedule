<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMM 행정 밴드 실시간 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slot-btn { transition: all 0.2s; position: relative; }
        /* 멤버별 색상 */
        .color-0 { background-color: #ef4444 !important; } /* 김태진 */
        .color-1 { background-color: #3b82f6 !important; } /* 김준헌 */
        .color-2 { background-color: #f59e0b !important; } /* 서유리 */
        .color-3 { background-color: #8b5cf6 !important; } /* 김건효 */
        .color-4 { background-color: #ec4899 !important; } /* 강지연 (핑크) */
        
        .bg-lunch { background-color: #374151; }
        .bg-dinner { background-color: #1f2937; }

        /* 🔥 합주 확정 스타일: 금색 테두리와 그림자 효과 */
        .confirmed-slot { 
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            outline: 2px solid #fbbf24;
            z-index: 20;
        }
        .selected-by-me { box-shadow: inset 0 0 0 2px #10b981; }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjqzM3ScDSoINSMiCukjFG6z7MBjinI1M",
            authDomain: "nextgenband.firebaseapp.com",
            databaseURL: "https://nextgenband-default-rtdb.firebaseio.com",
            projectId: "nextgenband",
            storageBucket: "nextgenband.firebasestorage.app",
            messagingSenderId: "251453757830",
            appId: "1:251453757830:web:201c7945ef0eba901db407",
            measurementId: "G-WV1SK3R50G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.remove = remove;
        // 멤버 5명으로 업데이트
        window.members = ["김태진", "김준헌", "서유리", "김건효", "강지연"];
        window.currentData = {}; 
    </script>
</head>
<body class="bg-slate-900 text-slate-100 p-4 font-sans text-sm">
    <div class="max-w-xl mx-auto space-y-4">
        <header class="text-center py-4">
            <h1 class="text-4xl font-black text-amber-400 tracking-tighter italic">KIMM BAND SYSTEM</h1>
            <div class="flex items-center justify-center gap-2 mt-2">
                <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Live Sync Online</span>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-xl">
                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase">Operator</label>
                <select id="memberSelect" onchange="window.renderCalendar()" class="w-full bg-transparent border-none p-1 text-white focus:ring-0 font-bold">
                    <option value="0">김태진 (기타/보컬)</option>
                    <option value="1">김준헌 (기타)</option>
                    <option value="2">서유리 (베이스/서브보컬)</option>
                    <option value="3">김건효 (드럼)</option>
                    <option value="4">강지연 (키보드)</option>
                </select>
            </div>
            <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-xl">
                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase">Period</label>
                <div class="flex gap-1 justify-center font-bold">
                    <select id="yearSelect" onchange="window.renderCalendar()" class="bg-transparent border-none p-1 text-white focus:ring-0 text-xs"></select>
                    <select id="monthSelect" onchange="window.renderCalendar()" class="bg-transparent border-none p-1 text-white focus:ring-0 text-xs"></select>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl">
            <h3 class="text-[10px] font-bold text-slate-500 mb-3 uppercase tracking-wider">Member Availability Stats</h3>
            <!-- 통계 레이아웃 5칸으로 확장 -->
            <div id="statsContainer" class="grid grid-cols-5 gap-2 text-center">
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-2xl">
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-500 mb-3 uppercase tracking-tighter">
                <div class="text-rose-500">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-500">Sat</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
        </div>
        
        <div class="flex justify-between items-center px-2 py-1 bg-slate-800 rounded-lg text-[9px] text-slate-400">
            <div class="flex gap-2">
                <span>점: 점심</span>
                <span>저: 저녁</span>
            </div>
            <span class="font-bold text-amber-400">5명 전원 합주 확정 시 불이 들어옵니다! 🔥</span>
        </div>
    </div>

    <script type="module">
        import { onValue, ref } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const yearSelect = document.getElementById('yearSelect');
        const monthSelect = document.getElementById('monthSelect');
        const grid = document.getElementById('calendarGrid');
        const statsContainer = document.getElementById('statsContainer');
        const now = new Date();

        for (let y = now.getFullYear(); y <= now.getFullYear() + 1; y++) {
            yearSelect.innerHTML += `<option value="${y}">${y}년</option>`;
        }
        for (let m = 0; m < 12; m++) {
            const selected = m === now.getMonth() ? 'selected' : '';
            monthSelect.innerHTML += `<option value="${m}" ${selected}>${m + 1}월</option>`;
        }

        setTimeout(() => {
            const schedulesRef = ref(window.db, 'schedules');
            onValue(schedulesRef, (snapshot) => {
                window.currentData = snapshot.val() || {};
                window.renderCalendar(); 
                renderStats(); 
            });
        }, 500); 

        window.toggleSlot = function(year, month, day, timeType) {
            const myIndex = document.getElementById('memberSelect').value;
            const dateKey = `${year}-${month}-${day}-${timeType}`;
            const dbRef = window.ref(window.db, `schedules/${dateKey}/${myIndex}`);
            if (window.currentData[dateKey] && window.currentData[dateKey][myIndex]) window.remove(dbRef);
            else window.set(dbRef, true);
        };

        // 📊 통계 계산 함수 (동적 길이 반영)
        function renderStats() {
            const counts = new Array(window.members.length).fill(0);
            Object.values(window.currentData).forEach(slot => {
                Object.keys(slot).forEach(mIdx => counts[parseInt(mIdx)]++);
            });

            statsContainer.innerHTML = counts.map((count, i) => `
                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-500 font-bold">${window.members[i]}</span>
                    <span class="text-lg font-black color-${i} rounded-md mt-1 shadow-inner">${count}</span>
                </div>
            `).join('');
        }

        window.renderCalendar = function() {
            grid.innerHTML = '';
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            const myIdx = document.getElementById('memberSelect').value;
            const firstDay = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            for (let x = 0; x < firstDay; x++) grid.appendChild(document.createElement('div'));

            for (let i = 1; i <= lastDay; i++) {
                const dayBox = document.createElement('div');
                dayBox.className = "flex flex-col gap-0.5";
                dayBox.appendChild(createButton(year, month+1, i, '점심', myIdx, 'bg-lunch', 'rounded-t-md'));
                dayBox.appendChild(createButton(year, month+1, i, '저녁', myIdx, 'bg-dinner', 'rounded-b-md'));
                grid.appendChild(dayBox);
            }
        }

        function createButton(y, m, d, type, myIdx, bgClass, radiusClass) {
            const dateKey = `${y}-${m}-${d}-${type}`;
            const btn = document.createElement('button');
            btn.className = `slot-btn h-8 flex items-center justify-center text-[10px] font-bold ${bgClass} ${radiusClass} overflow-hidden relative`;
            btn.onclick = () => window.toggleSlot(y, m, d, type);

            const slotData = window.currentData[dateKey];
            if (slotData) {
                const selected = Object.keys(slotData);
                const count = selected.length;
                
                if (count > 0) {
                    btn.innerHTML = '';
                    selected.forEach(idx => {
                        const bar = document.createElement('div');
                        bar.className = `h-full flex-1 color-${idx}`;
                        btn.appendChild(bar);
                    });
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = "absolute z-10 text-white drop-shadow-md text-[9px]";
                    textSpan.innerText = `${d}${type[0]}`;
                    btn.appendChild(textSpan);

                    // 멤버 전원 선택 시 테두리 효과 (동적 계산)
                    if (count === window.members.length) {
                        btn.classList.add('confirmed-slot');
                        textSpan.innerText = '🔥';
                    }
                    if (slotData[myIdx]) btn.classList.add('selected-by-me');
                } else {
                    btn.innerText = `${d}${type[0]}`;
                }
            } else {
                btn.innerText = `${d}${type[0]}`;
            }
            return btn;
        }
    </script>
</body>
</html>
