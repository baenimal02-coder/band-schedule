<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차세대 밴드 일정공유</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slot-btn.active-lunch { background-color: #10b981 !important; color: white; }
        .slot-btn.active-dinner { background-color: #3b82f6 !important; color: white; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 p-4 font-sans text-sm">
    <div class="max-w-xl mx-auto space-y-4">
        <header class="text-center py-4">
            <h1 class="text-3xl font-black text-emerald-400 tracking-tight italic">🎸 NEXT GEN</h1>
            <p class="text-gray-400 text-xs mt-1 uppercase tracking-widest">Practice Scheduler</p>
        </header>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700">
                <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Member</label>
                <select id="memberSelect" class="w-full bg-transparent border-none p-1 text-white focus:ring-0">
                    <option value="배상호(기타/보컬)">배상호 (기타/보컬)</option>
                    <option value="김준헌(기타)">김준헌 (기타)</option>
                    <option value="정동욱(베이스)">정동욱 (베이스)</option>
                    <option value="김건효(드럼)">김건효 (드럼)</option>
                </select>
            </div>
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 flex gap-2">
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Year/Month</label>
                    <div class="flex gap-1">
                        <select id="yearSelect" onchange="renderCalendar()" class="bg-transparent border-none p-1 text-white focus:ring-0 text-xs"></select>
                        <select id="monthSelect" onchange="renderCalendar()" class="bg-transparent border-none p-1 text-white focus:ring-0 text-xs"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-500 mb-3 uppercase">
                <div class="text-red-400">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-400">Sat</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-2">
                </div>
        </div>

        <div class="space-y-3">
            <div class="flex gap-4 text-[10px] justify-center text-gray-400 font-bold uppercase">
                <div class="flex items-center gap-1"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Lunch</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-full"></span> Dinner</div>
            </div>
            <button onclick="copyToClipboard()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95 text-base">
                일정 복사하기
            </button>
            <p class="text-[10px] text-gray-500 text-center leading-relaxed">
                날짜 선택 후 버튼을 눌러 카톡에 붙여넣으세요. <br>
                연도와 월을 변경하면 선택 내역이 초기화됩니다.
            </p>
        </div>
    </div>

    <script>
        const yearSelect = document.getElementById('yearSelect');
        const monthSelect = document.getElementById('monthSelect');
        const grid = document.getElementById('calendarGrid');

        // 초기 설정: 현재 날짜 기준
        const now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth();

        // 연도(올해~내년) 및 월 옵션 생성
        for (let y = currentYear; y <= currentYear + 1; y++) {
            const opt = document.createElement('option');
            opt.value = y; opt.innerText = y + '년';
            yearSelect.appendChild(opt);
        }
        for (let m = 0; m < 12; m++) {
            const opt = document.createElement('option');
            opt.value = m; opt.innerText = (m + 1) + '월';
            if (m === currentMonth) opt.selected = true;
            monthSelect.appendChild(opt);
        }

        function renderCalendar() {
            grid.innerHTML = '';
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            // 빈 칸
            for (let x = 0; x < firstDayIndex; x++) {
                grid.appendChild(document.createElement('div'));
            }

            // 날짜 생성
            for (let i = 1; i <= lastDay; i++) {
                const dayBox = document.createElement('div');
                dayBox.className = "flex flex-col gap-1";

                const lunchBtn = document.createElement('button');
                lunchBtn.className = "slot-btn h-7 bg-gray-700 rounded-t-md text-[9px] font-bold border-b border-gray-800 transition-colors";
                lunchBtn.innerText = i + ' 점';
                lunchBtn.onclick = () => lunchBtn.classList.toggle('active-lunch');

                const dinnerBtn = document.createElement('button');
                dinnerBtn.className = "slot-btn h-7 bg-gray-700 rounded-b-md text-[9px] font-bold transition-colors";
                dinnerBtn.innerText = i + ' 저';
                dinnerBtn.onclick = () => dinnerBtn.classList.toggle('active-dinner');

                dayBox.appendChild(lunchBtn);
                dayBox.appendChild(dinnerBtn);
                grid.appendChild(dayBox);
            }
        }

        function copyToClipboard() {
            const member = document.getElementById('memberSelect').value;
            const year = yearSelect.value;
            const month = parseInt(monthSelect.value) + 1;
            
            const lunchSlots = Array.from(document.querySelectorAll('.active-lunch')).map(b => b.innerText.split(' ')[0] + '일(점심)');
            const dinnerSlots = Array.from(document.querySelectorAll('.active-dinner')).map(b => b.innerText.split(' ')[0] + '일(저녁)');
            
            const allSlots = [...lunchSlots, ...dinnerSlots].sort((a, b) => parseInt(a) - parseInt(b));
            
            if (allSlots.length === 0) {
                alert('가능한 일정을 선택해주세요!');
                return;
            }

            const resultText = `[차세대 연습 일정 - ${member}]\n📅 ${year}년 ${month}월\n${allSlots.join('\n')}\n\n위 시간 합주 가능합니다!`;
            
            navigator.clipboard.writeText(resultText).then(() => {
                alert('복사 완료! 카톡방에 붙여넣어 주세요.');
            });
        }

        // 첫 실행
        renderCalendar();
    </script>
</body>
</html>
